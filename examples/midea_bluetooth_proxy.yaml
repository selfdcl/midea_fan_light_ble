# 第 10 级：通用 BLE 代理
# 目标：ESP32 只负责蓝牙扫描和主动 GATT 连接；设备发现、添加和协议控制
# 由 Home Assistant 的 midea_fan_light_ble 自定义集成完成。

esphome:
  name: midea-fan-light-bridge
  friendly_name: 美的风扇灯蓝牙代理

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  logs:
    bluetooth_proxy: INFO
    esp32_ble_tracker: INFO
    wifi: INFO
    api: INFO

api:
  encryption:
    key: !secret api_encryption_key
  actions:
    # Home Assistant 自定义集成调用这个通用动作。设备地址在首次扫描添加时保存，
    # 因此新增同协议风扇灯不需要修改或重新编译 ESPHome。
    - action: midea_ble_broadcast
      variables:
        address: string
        command: int
        value: int
        light_command: bool
      then:
        - script.execute:
            id: send_midea_ble_broadcast
            target_address: !lambda return address;
            command_code: !lambda return command;
            command_value: !lambda return value;
            is_light_command: !lambda return light_command;

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Midea BLE Proxy Fallback"
    password: !secret fallback_hotspot_password

captive_portal:

esp32_ble:
  use_psram: true
  max_connections: 5

# 0x4D11 在 Manufacturer Data 原始数组中按小端序写为 11 4D。
# 服务只作为 ESP32 广播载体，不要求风扇灯建立 GATT 连接。
esp32_ble_server:
  id: midea_broadcast_server
  manufacturer: "Midea BLE Broadcast Bridge"
  manufacturer_data: [0x11, 0x4D, 0x00]

esp32_ble_tracker:

bluetooth_proxy:
  active: true
  cache_services: true
  connection_slots: 3

globals:
  - id: midea_command_sequence
    type: uint8_t
    restore_value: false
    initial_value: "1"

script:
  # 通用 0x4D11 双帧广播控制器。第一帧携带命令，第二帧释放按键，
  # 最后恢复空闲广播；状态仍由设备的 0x06A8 广播返回给 HA。
  - id: send_midea_ble_broadcast
    mode: queued
    max_runs: 8
    parameters:
      target_address: string
      command_code: int
      command_value: int
      is_light_command: bool
    then:
      - if:
          condition:
            lambda: |-
              unsigned int mac[6];
              return command_code >= 0 && command_code <= 0xFF &&
                     command_value >= 0 && command_value <= 0xFF &&
                     sscanf(
                       target_address.c_str(),
                       "%02x:%02x:%02x:%02x:%02x:%02x",
                       &mac[0], &mac[1], &mac[2],
                       &mac[3], &mac[4], &mac[5]
                     ) == 6;
          then:
            - esp32_ble_tracker.stop_scan:
            - delay: 200ms
            - lambda: |-
                static const uint8_t base[16] = {
                  0xD1, 0xF3, 0x51, 0xD3, 0x73, 0x95, 0xF3, 0x60,
                  0x82, 0xE0, 0x22, 0x80, 0xA2, 0x46, 0x44, 0x31
                };
                unsigned int parsed_mac[6];
                sscanf(
                  target_address.c_str(),
                  "%02x:%02x:%02x:%02x:%02x:%02x",
                  &parsed_mac[0], &parsed_mac[1], &parsed_mac[2],
                  &parsed_mac[3], &parsed_mac[4], &parsed_mac[5]
                );

                const uint8_t sequence = id(midea_command_sequence) & 0x0F;
                id(midea_command_sequence) = (sequence + 1) & 0x0F;
                std::vector<uint8_t> frame = {
                  0x11, 0x4D,
                  0x19, static_cast<uint8_t>(0x10 | sequence),
                  static_cast<uint8_t>(parsed_mac[5]),
                  static_cast<uint8_t>(parsed_mac[4]),
                  static_cast<uint8_t>(parsed_mac[3]),
                  static_cast<uint8_t>(parsed_mac[2]),
                  static_cast<uint8_t>(parsed_mac[1]),
                  static_cast<uint8_t>(parsed_mac[0]),
                  0x01
                };
                for (int i = 0; i < 15; i++) {
                  frame.push_back(base[(sequence + 14 + i) & 0x0F]);
                }

                uint8_t *tail = frame.data() + 11;
                const uint8_t command = static_cast<uint8_t>(command_code);
                const uint8_t value = static_cast<uint8_t>(command_value);
                tail[0] ^= 0x01;
                if (is_light_command) {
                  tail[1] ^= 0x01;
                }
                tail[2] ^= command;
                if (is_light_command) {
                  tail[3] ^= value;
                  tail[14] ^= static_cast<uint8_t>(command + value + 3);
                } else {
                  tail[14] ^= static_cast<uint8_t>(command + 2);
                }

                id(midea_broadcast_server).set_manufacturer_data(frame);
                ESP_LOGI(
                  "midea_broadcast",
                  "TX command address=%s seq=%X command=%02X value=%02X type=%s",
                  target_address.c_str(), sequence, command, value,
                  is_light_command ? "LIGHT" : "FAN"
                );
            - delay: 900ms
            - lambda: |-
                static const uint8_t base[16] = {
                  0xD1, 0xF3, 0x51, 0xD3, 0x73, 0x95, 0xF3, 0x60,
                  0x82, 0xE0, 0x22, 0x80, 0xA2, 0x46, 0x44, 0x31
                };
                unsigned int parsed_mac[6];
                sscanf(
                  target_address.c_str(),
                  "%02x:%02x:%02x:%02x:%02x:%02x",
                  &parsed_mac[0], &parsed_mac[1], &parsed_mac[2],
                  &parsed_mac[3], &parsed_mac[4], &parsed_mac[5]
                );

                const uint8_t sequence = id(midea_command_sequence) & 0x0F;
                id(midea_command_sequence) = (sequence + 1) & 0x0F;
                std::vector<uint8_t> frame = {
                  0x11, 0x4D,
                  0x19, static_cast<uint8_t>(0x10 | sequence),
                  static_cast<uint8_t>(parsed_mac[5]),
                  static_cast<uint8_t>(parsed_mac[4]),
                  static_cast<uint8_t>(parsed_mac[3]),
                  static_cast<uint8_t>(parsed_mac[2]),
                  static_cast<uint8_t>(parsed_mac[1]),
                  static_cast<uint8_t>(parsed_mac[0]),
                  0x01
                };
                for (int i = 0; i < 15; i++) {
                  frame.push_back(base[(sequence + 14 + i) & 0x0F]);
                }
                uint8_t *tail = frame.data() + 11;
                tail[0] ^= 0x01;
                tail[14] ^= 0x02;
                id(midea_broadcast_server).set_manufacturer_data(frame);
                ESP_LOGI(
                  "midea_broadcast",
                  "TX release address=%s seq=%X",
                  target_address.c_str(), sequence
                );
            - delay: 900ms
            - lambda: |-
                id(midea_broadcast_server).set_manufacturer_data({
                  0x11, 0x4D, 0x00
                });
            - esp32_ble_tracker.start_scan:
                continuous: true
          else:
            - logger.log:
                tag: midea_broadcast
                level: ERROR
                format: "拒绝广播：设备地址或命令参数无效"
