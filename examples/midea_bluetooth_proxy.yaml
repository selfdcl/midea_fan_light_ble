# 第 10 级：通用 BLE 代理
# 目标：ESP32 只负责蓝牙扫描和主动 GATT 连接；设备发现、添加和协议控制
# 由 Home Assistant 的 midea_fan_light_ble 自定义集成完成。

esphome:
  name: midea-fan-light-bridge
  friendly_name: 美的风扇灯蓝牙代理

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  logs:
    bluetooth_proxy: INFO
    esp32_ble_tracker: INFO
    wifi: INFO
    api: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Midea BLE Proxy Fallback"
    password: !secret fallback_hotspot_password

captive_portal:

esp32_ble:
  use_psram: true
  max_connections: 5

esp32_ble_tracker:

bluetooth_proxy:
  active: true
  cache_services: true
  connection_slots: 3
